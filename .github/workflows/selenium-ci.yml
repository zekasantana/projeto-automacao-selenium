name: Selenium CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selenium-demo-web-shop
  cancel-in-progress: false

jobs:

  smoke-cross-browser:
    name: Smoke - ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            user_secret: QA_USER_CHROME

          - browser: firefox
            user_secret: QA_USER_FIREFOX

          - browser: edge
            user_secret: QA_USER_EDGE

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Exibir versões do ambiente
        run: |
          java -version
          mvn -version

      - name: Validar credenciais de teste
        env:
          TEST_USER_EMAIL: ${{ secrets[matrix.user_secret] }}
          TEST_USER_PASSWORD: ${{ secrets.QA_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$TEST_USER_EMAIL" ]; then
            echo "ERRO: o secret de usuário não foi carregado."
            echo "Secret esperado: ${{ matrix.user_secret }}"
            exit 1
          fi

          if [ -z "$TEST_USER_PASSWORD" ]; then
            echo "ERRO: QA_PASSWORD não foi carregado."
            exit 1
          fi

          echo "Credencial de usuário carregada."
          echo "Tamanho do usuário: ${#TEST_USER_EMAIL}"
          echo "Tamanho da senha: ${#TEST_USER_PASSWORD}"

      - name: Executar Smoke no ${{ matrix.browser }}
        env:
          TEST_USER_EMAIL: ${{ secrets[matrix.user_secret] }}
          TEST_USER_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: >
          mvn clean test
          -Dtest=RunCucumberTest
          -Dbrowser=${{ matrix.browser }}
          -Dheadless=true
          -Dtest.user.email="$TEST_USER_EMAIL"
          -Dtest.user.password="$TEST_USER_PASSWORD"
          -Dcucumber.filter.tags="@smoke"

      - name: Publicar resultados do Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-smoke-${{ matrix.browser }}
          path: target/allure-results
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar relatórios do Maven
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-smoke-${{ matrix.browser }}
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 7


  regression-web:
    name: Regression - Chrome
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Exibir versões do ambiente
        run: |
          java -version
          mvn -version
          google-chrome --version

      - name: Validar credenciais Regression
        env:
          TEST_USER_EMAIL: ${{ secrets.QA_USER_REGRESSION }}
          TEST_USER_PASSWORD: ${{ secrets.QA_PASSWORD }}
        shell: bash
        run: |
          if [ -z "$TEST_USER_EMAIL" ]; then
            echo "ERRO: QA_USER_REGRESSION não foi carregado."
            exit 1
          fi

          if [ -z "$TEST_USER_PASSWORD" ]; then
            echo "ERRO: QA_PASSWORD não foi carregado."
            exit 1
          fi

          echo "Credenciais Regression carregadas."
          echo "Tamanho do usuário: ${#TEST_USER_EMAIL}"
          echo "Tamanho da senha: ${#TEST_USER_PASSWORD}"

      - name: Executar Regression no Chrome
        env:
          TEST_USER_EMAIL: ${{ secrets.QA_USER_REGRESSION }}
          TEST_USER_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: >
          mvn clean test
          -Dtest=RunCucumberTest
          -Dbrowser=chrome
          -Dheadless=true
          -Dtest.user.email="$TEST_USER_EMAIL"
          -Dtest.user.password="$TEST_USER_PASSWORD"
          -Dcucumber.filter.tags="@regression"

      - name: Publicar resultados do Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-regression-chrome
          path: target/allure-results
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar relatórios do Maven
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-regression-chrome
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 7


  api-tests:
    name: API - RestAssured
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Exibir versões do ambiente
        run: |
          java -version
          mvn -version

      - name: Executar testes de API
        run: >
          mvn clean test
          -Dtest=ProductApiTest

      - name: Publicar resultados do Allure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api
          path: target/allure-results
          if-no-files-found: warn
          retention-days: 7

      - name: Publicar relatórios do Maven
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-api
          path: target/surefire-reports
          if-no-files-found: warn
          retention-days: 7


  sonar-analysis:
    name: SonarQube Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Validar credenciais Sonar
        env:
            TEST_USER_EMAIL: ${{ secrets.QA_USER_SONAR }}
            TEST_USER_PASSWORD: ${{ secrets.QA_PASSWORD }}
        shell: bash
        run: |
            if [ -z "$TEST_USER_EMAIL" ]; then
              echo "ERRO: QA_USER_SONAR não foi carregado."
              exit 1
            fi
            
            if [ -z "$TEST_USER_PASSWORD" ]; then
              echo "ERRO: QA_PASSWORD não foi carregado."
              exit 1
            fi
            
            echo "Credenciais Sonar carregadas."
            echo "Tamanho do usuário: ${#TEST_USER_EMAIL}"
            echo "Tamanho da senha: ${#TEST_USER_PASSWORD}"

      - name: Executar testes e gerar cobertura
        env:
          TEST_USER_EMAIL: ${{ secrets.QA_USER_SONAR }}
          TEST_USER_PASSWORD: ${{ secrets.QA_PASSWORD }}
        run: >
          mvn -B clean test
          -Dheadless=true
          -Dbrowser=chrome
          -Dtest.user.email="$TEST_USER_EMAIL"
          -Dtest.user.password="$TEST_USER_PASSWORD"

      - name: Executar análise no SonarQube Cloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B
          org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=zekasantana_projeto-automacao-selenium