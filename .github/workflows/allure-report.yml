name: Allure Report

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: selenium-demo-web-shop
  cancel-in-progress: false

jobs:
  allure-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Executar testes
        id: testes
        continue-on-error: true
        run: mvn -B clean test -Dheadless=true -Dbrowser=chrome

      - name: Diagnosticar resultados do Allure
        if: always()
        shell: bash
        run: |
          echo "=== Conteúdo de target ==="
          ls -la target || true
                
          echo "=== Conteúdo de target/allure-results ==="
          ls -la target/allure-results || true
                
          echo "=== Quantidade de result.json ==="
          find target/allure-results -name "*-result.json" 2>/dev/null | wc -l

      - name: Verificar se a branch gh-pages existe
        if: always()
        id: verificar-gh-pages
        shell: bash
        run: |
          if git ls-remote --exit-code --heads origin gh-pages; then
            echo "existe=true" >> "$GITHUB_OUTPUT"
          else
            echo "existe=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Recuperar histórico do relatório
        if: always()
        shell: bash
        run: |
          mkdir -p target/allure-results/history
            
            if [ -d "gh-pages/history" ]; then
              echo "Recuperando histórico do novo formato..."
              cp -r gh-pages/history/. target/allure-results/history/
            
            elif [ -d "gh-pages/last-history" ]; then
              echo "Migrando histórico do formato antigo..."
              cp -r gh-pages/last-history/. target/allure-results/history/
            
            else
              echo "Nenhum histórico anterior encontrado."
            fi

      - name: Preparar diretório na primeira publicação
        if: always() && steps.verificar-gh-pages.outputs.existe == 'false'
        shell: bash
        run: mkdir -p gh-pages

      - name: Instalar Allure CLI
        if: always()
        shell: bash
        run: |
            npm install -g allure-commandline --save-dev
            allure --version

      - name: Publicar relatório no GitHub Pages
        if: always()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Validar resultado dos testes
        if: steps.testes.outcome == 'failure'
        run: exit 1